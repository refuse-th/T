<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng 20-11 😈</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải Font chữ tiếng Việt mềm mại, trang trọng -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .font-handwriting {
            font-family: 'Dancing Script', cursive;
        }

        /* Hiệu ứng cánh hoa rơi nhẹ nhàng ở màn hình 20/11 */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }

        /* =========================================================
           HIỆU ỨNG JUMPSCARE (RUNG LẮC MẠNH + NHẤP NHÁY ĐỎ/ĐEN/TRẮNG)
           ========================================================= */
        @keyframes violentShake {
            0% { transform: translate(0, 0) rotate(0deg) scale(1.05); }
            10% { transform: translate(-25px, -20px) rotate(-4deg) scale(1.15); }
            20% { transform: translate(25px, 15px) rotate(4deg) scale(1.08); }
            30% { transform: translate(-30px, 20px) rotate(-3deg) scale(1.2); }
            40% { transform: translate(30px, -25px) rotate(5deg) scale(1.1); }
            50% { transform: translate(-20px, 25px) rotate(-5deg) scale(1.18); }
            60% { transform: translate(25px, -15px) rotate(3deg) scale(1.06); }
            70% { transform: translate(-25px, -25px) rotate(-4deg) scale(1.22); }
            80% { transform: translate(20px, 20px) rotate(4deg) scale(1.12); }
            90% { transform: translate(-15px, -10px) rotate(-2deg) scale(1.16); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1.05); }
        }

        @keyframes strobeFlash {
            0%, 49% { background-color: #000000; }
            50%, 74% { background-color: #dc2626; } /* Đỏ máu */
            75%, 100% { background-color: #ffffff; } /* Trắng chói */
        }

        @keyframes imageInvertFlash {
            0%, 65% { filter: contrast(150%) brightness(100%) invert(0); }
            66%, 82% { filter: contrast(250%) brightness(140%) invert(1); }
            83%, 100% { filter: contrast(200%) sepia(100%) hue-rotate(-50deg) saturate(500%); }
        }

        .scare-active {
            animation: strobeFlash 0.09s infinite !important;
        }

        .scare-image-shake {
            animation: violentShake 0.12s infinite, imageInvertFlash 0.18s infinite !important;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#fff5f7] via-[#fffbeb] to-[#ffe4e6] text-stone-800 flex items-center justify-center p-4 select-none">

    <!-- =========================================================
         PHẦN 1: GIAO DIỆN CHÀO MỪNG 20/11 ẤM ÁP, TRANG TRỌNG
         ========================================================= -->
    <main id="welcomeScreen" class="relative w-full max-w-xl bg-white/90 backdrop-blur-md border-2 border-rose-200 rounded-3xl shadow-[0_20px_50px_rgba(244,63,94,0.15)] p-6 sm:p-10 text-center overflow-hidden transition-all duration-300">
        
        <!-- Họa tiết hoa trang trí góc thiệp -->
        <div class="absolute -top-6 -left-6 w-28 h-28 opacity-80 pointer-events-none animate-float">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="14" fill="#F59E0B"/>
                <path d="M50 10C56 25 60 32 50 36C40 32 44 25 50 10Z" fill="#FB7185"/>
                <path d="M50 90C56 75 60 68 50 64C40 68 44 75 50 90Z" fill="#FB7185"/>
                <path d="M10 50C25 44 32 40 36 50C32 60 25 56 10 50Z" fill="#FDA4AF"/>
                <path d="M90 50C75 44 68 40 64 50C68 60 75 56 90 50Z" fill="#FDA4AF"/>
                <path d="M22 22C36 28 42 32 40 40C32 42 28 36 22 22Z" fill="#F43F5E"/>
                <path d="M78 78C64 72 58 68 60 60C68 58 72 64 78 78Z" fill="#F43F5E"/>
                <path d="M78 22C72 36 68 42 60 40C58 32 64 28 78 22Z" fill="#FB7185"/>
                <path d="M22 78C28 64 32 58 40 60C42 68 36 72 22 78Z" fill="#FB7185"/>
            </svg>
        </div>

        <div class="absolute -bottom-6 -right-6 w-28 h-28 opacity-80 pointer-events-none animate-float" style="animation-delay: 1.5s;">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="14" fill="#D97706"/>
                <path d="M50 10C56 25 60 32 50 36C40 32 44 25 50 10Z" fill="#FBBF24"/>
                <path d="M50 90C56 75 60 68 50 64C40 68 44 75 50 90Z" fill="#FBBF24"/>
                <path d="M10 50C25 44 32 40 36 50C32 60 25 56 10 50Z" fill="#FCD34D"/>
                <path d="M90 50C75 44 68 40 64 50C68 60 75 56 90 50Z" fill="#FCD34D"/>
                <path d="M22 22C36 28 42 32 40 40C32 42 28 36 22 22Z" fill="#F59E0B"/>
                <path d="M78 78C64 72 58 68 60 60C68 58 72 64 78 78Z" fill="#F59E0B"/>
            </svg>
        </div>

        <!-- Huy hiệu ngày lễ -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-rose-100 text-rose-700 text-xs sm:text-sm font-bold tracking-wide uppercase mb-4 shadow-sm">
            <span></span>
            <span>Tặng bạn T -))</span>
            <span></span>
        </div>

        <!-- Con số 20/11 nổi bật -->
        <h1 class="font-handwriting text-6xl sm:text-7xl text-rose-600 drop-shadow-sm mb-2">
            20 / 11
        </h1>

        <h2 class="text-xl sm:text-2xl font-bold text-amber-900 mb-5">
            
        </h2>

        <!-- Khung lời chúc ý nghĩa -->
        <div class="bg-gradient-to-b from-amber-50/90 to-rose-50/70 border border-amber-200/80 rounded-2xl p-5 sm:p-6 mb-7 shadow-inner">
            <p class="text-stone-700 text-sm sm:text-base leading-relaxed italic">
                "Ờm... nhân ngày 20/11 mình mong bn giảm cái tính dỗi hờn đi, chửi bậy ít thôi kh mình cho ăn đấm bn à. Mình chỉ mong thế thôi!"
            </p>
            <div class="mt-3 flex justify-center items-center gap-2 text-amber-700 text-xs font-semibold">
                <span></span>
                <span>Mở hộ t cái thiệp</span>
                <span></span>
            </div>
        </div>

        <!-- Nút bấm kích hoạt -->
        <button id="openCardBtn" class="group relative inline-flex items-center justify-center gap-3 px-8 py-4 text-base sm:text-lg font-bold text-white bg-gradient-to-r from-rose-500 via-pink-500 to-amber-500 rounded-2xl shadow-[0_10px_25px_rgba(244,63,94,0.4)] hover:shadow-[0_14px_30px_rgba(244,63,94,0.55)] hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 cursor-pointer w-full sm:w-auto">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 transition-transform group-hover:scale-110" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <span>Mở Thiệp Chúc Mừng 20/11</span>
        </button>

        <p class="mt-5 text-xs text-stone-400">
            Nhấn vào nút trên để xem lời chúc đặc biệt gửi tới bạn
        </p>
    </main>

    <!-- =========================================================
         PHẦN 2: MÀN HÌNH JUMPSCARE TOÀN MÀN HÌNH (ẨN BAN ĐẦU)
         ========================================================= -->
    <div id="scareOverlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-black overflow-hidden">
        <!-- Ảnh kinh dị toàn màn hình -->
        <img id="scareImage" src="" alt="" class="w-full h-full object-cover sm:object-contain scare-image-shake pointer-events-none select-none">
    </div>

    <!-- Thẻ Audio phát tiếng hét -->
    <audio id="scareAudio" preload="auto" loop></audio>

    <script>
        /* =========================================================================
           HƯỚNG DẪN TỰ THAY ẢNH & ÂM THANH KINH DỊ TRỰC TIẾP TRONG CODE:
           -------------------------------------------------------------------------
           1. Thay ảnh kinh dị (HORROR_IMAGE_SRC):
              - Cách 1 (Khuyên dùng khi up GitHub): Đặt ảnh cùng thư mục với file index.html
                và điền tên file vào. Ví dụ: const HORROR_IMAGE_SRC = "anh_ma.jpg";
              - Cách 2: Dán trực tiếp đường link ảnh trên mạng (URL) hoặc chuỗi Base64.
                Ví dụ: const HORROR_IMAGE_SRC = "https://example.com/ghost.jpg";
              - Mặc định bên dưới đang dùng sẵn hình khuôn mặt ma SVG để chạy ngay lập tức.

           2. Thay âm thanh hét (HORROR_AUDIO_SRC):
              - Đặt file âm thanh (.mp3 hoặc .wav) cùng thư mục với file HTML và điền tên:
                Ví dụ: const HORROR_AUDIO_SRC = "doama.mp3";
              - Nếu bạn để trống hoặc chưa có file mp3, hệ thống đã tích hợp sẵn bộ tạo
                tiếng thét chói tai tự động (Web Audio API) nên vẫn dọa giật mình bình thường!
           ========================================================================= */

        // 👇 DÁN LINK ẢNH, BASE64 HOẶC TÊN FILE ẢNH CỦA BẠN VÀO DÒNG DƯỚI ĐÂY:
        const HORROR_IMAGE_SRC = "data:image/svg+xml;utf8," + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
                <rect width="800" height="800" fill="#050505"/>
                <defs>
                    <radialGradient id="faceGlow" cx="50%" cy="45%" r="50%">
                        <stop offset="0%" stop-color="#e5e5e5"/>
                        <stop offset="65%" stop-color="#737373"/>
                        <stop offset="100%" stop-color="#09090b"/>
                    </radialGradient>
                    <filter id="distort">
                        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise"/>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" />
                    </filter>
                </defs>
                <!-- Hộp sọ biến dạng -->
                <g filter="url(#distort)">
                    <ellipse cx="400" cy="390" rx="220" ry="290" fill="url(#faceGlow)"/>
                    <!-- Hốc mắt đen sâu thẳm -->
                    <ellipse cx="310" cy="310" rx="58" ry="72" fill="#000000"/>
                    <ellipse cx="490" cy="310" rx="58" ry="72" fill="#000000"/>
                    <!-- Tròng mắt đỏ rực nhỏ xíu nhìn chằm chằm -->
                    <circle cx="310" cy="315" r="11" fill="#ff0000"/>
                    <circle cx="310" cy="315" r="4" fill="#ffffff"/>
                    <circle cx="490" cy="315" r="11" fill="#ff0000"/>
                    <circle cx="490" cy="315" r="4" fill="#ffffff"/>
                    <!-- Vết máu chảy từ mắt -->
                    <path d="M295 375 Q290 450 280 510" stroke="#990000" stroke-width="10" fill="none" stroke-linecap="round"/>
                    <path d="M505 375 Q515 460 525 530" stroke="#990000" stroke-width="12" fill="none" stroke-linecap="round"/>
                    <!-- Hốc mũi -->
                    <path d="M385 410 L370 460 L395 450 Z" fill="#000000"/>
                    <path d="M415 410 L430 460 L405 450 Z" fill="#000000"/>
                    <!-- Miệng há to gào thét -->
                    <ellipse cx="400" cy="575" rx="95" ry="125" fill="#000000" stroke="#450a0a" stroke-width="12"/>
                    <!-- Răng nhọn lởm chởm -->
                    <polygon points="330,490 345,530 360,485" fill="#d4d4d8"/>
                    <polygon points="365,480 380,525 395,480" fill="#d4d4d8"/>
                    <polygon points="405,480 420,525 435,480" fill="#d4d4d8"/>
                    <polygon points="440,485 455,530 470,490" fill="#d4d4d8"/>
                    <polygon points="340,665 355,620 370,670" fill="#d4d4d8"/>
                    <polygon points="385,675 400,625 415,675" fill="#d4d4d8"/>
                    <polygon points="430,670 445,620 460,665" fill="#d4d4d8"/>
                </g>
            </svg>
        `);

        // 👇 DÁN TÊN FILE ÂM THANH (VD: "doama.mp3") HOẶC LINK MP3 VÀO DÒNG DƯỚI ĐÂY:
        const HORROR_AUDIO_SRC = "doama.mp3";

        // =========================================================================
        // LOGIC XỬ LÝ JUMPSCARE
        // =========================================================================
        const openCardBtn = document.getElementById('openCardBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const scareOverlay = document.getElementById('scareOverlay');
        const scareImage = document.getElementById('scareImage');
        const scareAudio = document.getElementById('scareAudio');

        // Gán nguồn ảnh và âm thanh ngay khi tải trang
        scareImage.src = HORROR_IMAGE_SRC;
        if (HORROR_AUDIO_SRC) {
            scareAudio.src = HORROR_AUDIO_SRC;
        }

        // Bộ tạo âm thanh thét rùng rợn dự phòng bằng Web Audio API (kêu ngay lập tức, không cần mạng hay file mp3)
        function playSynthScream() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioCtx();

                // Tạo 3 luồng sóng chói tai đan xen tạo tiếng hét ma quái
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const osc3 = ctx.createOscillator();
                const gainNode = ctx.createGain();

                osc1.type = 'sawtooth';
                osc2.type = 'square';
                osc3.type = 'sawtooth';

                const now = ctx.currentTime;
                // Tần số cao vút rồi rít lên liên tục
                osc1.frequency.setValueAtTime(650, now);
                osc1.frequency.exponentialRampToValueAtTime(1650, now + 0.15);
                osc1.frequency.linearRampToValueAtTime(1100, now + 0.6);
                osc1.frequency.exponentialRampToValueAtTime(1900, now + 1.2);

                osc2.frequency.setValueAtTime(680, now);
                osc2.frequency.exponentialRampToValueAtTime(1720, now + 0.15);
                osc2.frequency.linearRampToValueAtTime(980, now + 0.8);

                osc3.frequency.setValueAtTime(180, now);
                osc3.frequency.linearRampToValueAtTime(95, now + 1.5); // Tiếng bass gầm rú

                // Âm lượng tối đa
                gainNode.gain.setValueAtTime(1.0, now);
                gainNode.gain.setValueAtTime(1.0, now + 2.5);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 3.5);

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                osc3.connect(gainNode);
                gainNode.connect(ctx.destination);

                osc1.start(now);
                osc2.start(now);
                osc3.start(now);

                osc1.stop(now + 3.5);
                osc2.stop(now + 3.5);
                osc3.stop(now + 3.5);
            } catch (e) {
                console.warn("Trình duyệt chặn Web Audio:", e);
            }
        }

        // Yêu cầu bật chế độ toàn màn hình (Fullscreen) để tăng độ giật mình
        function requestFullScreenMode() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        // Kích hoạt màn hình kinh dị khi nhấn nút
        openCardBtn.addEventListener('click', function () {
            // 1. Bật toàn màn hình
            requestFullScreenMode();

            // 2. Ẩn thiệp 20/11, bật nền nhấp nháy đỏ/đen/trắng toàn màn hình
            welcomeScreen.classList.add('hidden');
            scareOverlay.classList.remove('hidden');
            scareOverlay.classList.add('flex', 'scare-active');

            // 3. Rung điện thoại (nếu người xem mở bằng điện thoại Android)
            if (navigator.vibrate) {
                navigator.vibrate([400, 100, 400, 100, 600, 100, 800]);
            }

            // 4. Phát file âm thanh riêng (nếu có), nếu lỗi hoặc chưa có file thì phát tiếng thét tổng hợp
            scareAudio.volume = 1.0;
            const playPromise = scareAudio.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    playSynthScream();
                });
            } else {
                playSynthScream();
            }
        });
    </script>
</body>
</html>
